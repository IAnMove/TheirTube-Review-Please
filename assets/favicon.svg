<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">TheirTube favicon</title>
  <desc id="desc">A square red TheirTube surveillance-eye seal.</desc>
  <defs>
    <linearGradient id="panelRed" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff5a4f"/>
      <stop offset="0.45" stop-color="#c92828"/>
      <stop offset="1" stop-color="#751315"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset="1" stop-color="#d2b765"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="8" dy="9" stdDeviation="0" flood-color="#000000" flood-opacity="0.58"/>
