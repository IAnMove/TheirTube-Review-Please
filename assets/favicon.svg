    <rect x="51" y="63" width="154" height="130" rx="24" fill="none" stroke="#ffd38f" stroke-width="5" opacity="0.38"/>
    <path d="M64 128 C84 96 113 84 140 91 C160 96 178 112 193 128 C178 144 160 160 140 165 C113 172 84 160 64 128Z" fill="#10120f" stroke="url(#paper)" stroke-width="10"/>
    <circle cx="132" cy="128" r="32" fill="url(#paper)"/>
    <circle cx="132" cy="128" r="15" fill="#11130f"/>
    <circle cx="139" cy="121" r="6" fill="#d9483c"/>
    <path d="M57 80 H199 M57 176 H199" stroke="#11130f" stroke-width="5" opacity="0.5"/>
