<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="desk" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#182022"/>
      <stop offset="0.48" stop-color="#2c302b"/>
      <stop offset="1" stop-color="#101416"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#77d4cb" stroke-opacity=".08" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#77d4cb" fill-opacity=".16"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#desk)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g opacity=".18" fill="none" stroke="#e5d6b5" stroke-width="4">
    <path d="M118 180h350v220H118z"/>
    <path d="M1120 130h260v360h-260z"/>
    <path d="M1030 620h390v190h-390z"/>
  </g>
  <g opacity=".18" stroke="#c45448" stroke-width="5" fill="none">
    <path d="M1280 260l210 140"/>
    <path d="M1490 260l-210 140"/>
  </g>
  <rect width="1600" height="1000" filter="url(#noise)"/>
</svg>
